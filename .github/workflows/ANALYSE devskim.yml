name: DevSkim

on:
  push:
    branches: [ "master", "main" ]

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@v1

      - name: Publish DevSkim SARIF results
        if: ${{ !cancelled() }}
        uses: ./.github/actions/publish-sarif
        with:
          sarif-path: devskim-results.sarif
          category: devskim